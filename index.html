<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Habit Tracker & Analytics</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #0f172a; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.02), 0 4px 6px -4px rgb(0 0 0 / 0.02);
            margin-bottom: 24px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        /* Configuración de Hábitos */
        .habit-form {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .habit-form {
                flex-direction: column;
            }
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            margin-left: 8px;
        }
        .btn-danger:hover { background-color: #fecaca; }

        .habits-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .habit-tag {
            background: #f1f5f9;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        /* Matriz de Habit Tracker Limpia y Horizontal */
        .tracker-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .tracker-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
            background: #fff;
        }

        .tracker-table th, .tracker-table td {
            border: 1px solid var(--border);
            padding: 8px;
            white-space: nowrap;
        }

        .tracker-table th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 10px 12px;
        }

        .tracker-table th.day-col {
            width: 60px;
            background-color: #f1f5f9;
        }

        .checkbox-cell {
            cursor: pointer;
            width: 40px;
            height: 40px;
            transition: background-color 0.15s, transform 0.1s;
        }

        .checkbox-cell:hover {
            background-color: #e2e8f0;
        }

        .checkbox-cell.checked {
            background-color: var(--success);
        }

        /* Sección de Gráfica / Analítica de Progreso */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stat-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-percentage {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✨ Mi Tracker & Analytics</h1>
            <p>Diseño limpio, organizado y analíticas de progreso en tiempo real.</p>
        </header>

        <!-- Configuración de Hábitos / Asignaturas -->
        <div class="card">
            <h2>🎯 Administrar Hábitos / Asignaturas</h2>
            <div class="habit-form">
                <input type="text" id="habitInput" placeholder="Ej. Anatomía, Gimnasio, Inglés...">
                <button onclick="addHabit()">Agregar</button>
            </div>
            <div class="habits-tags" id="habitsTagsContainer"></div>
        </div>

        <!-- Matriz Principal -->
        <div class="card">
            <h2>📅 Matriz Mensual (31 Días)</h2>
            <div class="tracker-container" id="trackerTableWrapper"></div>
        </div>

        <!-- Gráfica de Progreso por Asignatura / Hábito -->
        <div class="card">
            <h2>📈 Gráfica y Porcentaje de Progreso</h2>
            <div class="analytics-grid" id="analyticsContainer"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
        });

        function getHabits() {
            return JSON.parse(localStorage.getItem("tracker_habits_v3")) || ["Anatomía", "Gimnasio", "Inglés"];
        }

        function getRecords() {
            return JSON.parse(localStorage.getItem("tracker_records_v3")) || {};
        }

        function addHabit() {
            const input = document.getElementById("habitInput");
            const name = input.value.trim();
            if(!name) return;

            let habits = getHabits();
            if(habits.includes(name)) {
                alert("Este elemento ya está registrado.");
                return;
            }

            habits.push(name);
            localStorage.setItem("tracker_habits_v3", JSON.stringify(habits));
            input.value = "";
            renderApp();
        }

        function deleteHabit(index) {
            let habits = getHabits();
            habits.splice(index, 1);
            localStorage.setItem("tracker_habits_v3", JSON.stringify(habits));
            renderApp();
        }

        function toggleRecord(day, habit) {
            let records = getRecords();
            const key = `${day}_${habit}`;
            records[key] = !records[key];
            localStorage.setItem("tracker_records_v3", JSON.stringify(records));
            renderApp();
        }

        function renderApp() {
            renderTags();
            renderTable();
            renderAnalytics();
        }

        function renderTags() {
            const habits = getHabits();
            const container = document.getElementById("habitsTagsContainer");
            container.innerHTML = "";
            
            if(habits.length === 0) {
                container.innerHTML = `<span style="color:var(--text-muted); font-size:0.9rem;">No hay elementos agregados aún.</span>`;
                return;
            }

            habits.forEach((habit, index) => {
                const tag = document.createElement("div");
                tag.className = "habit-tag";
                tag.innerHTML = `${habit} <button class="btn-danger" onclick="deleteHabit(${index})">×</button>`;
                container.appendChild(tag);
            });
        }

        function renderTable() {
            const habits = getHabits();
            const records = getRecords();
            const wrapper = document.getElementById("trackerTableWrapper");
            
            if(habits.length === 0) {
                wrapper.innerHTML = `<div class="empty-state">Agrega elementos arriba para generar tu matriz.</div>`;
                return;
            }

            let html = `<table class="tracker-table"><thead><tr><th class="day-col">Día</th>`;
            habits.forEach(habit => {
                html += `<th>${habit}</th>`;
            });
            html += `</tr></thead><tbody>`;

            for(let day = 1; day <= 31; day++) {
                html += `<tr><td class="day-col"><strong>${day}</strong></td>`;
                habits.forEach(habit => {
                    const key = `${day}_${habit}`;
                    const isChecked = records[key] ? "checked" : "";
                    html += `<td class="checkbox-cell ${isChecked}" onclick="toggleRecord(${day}, '${habit}')" title="Día ${day} - ${habit}"></td>`;
                });
                html += `</tr>`;
            }

            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        function renderAnalytics() {
            const habits = getHabits();
            const records = getRecords();
            const container = document.getElementById("analyticsContainer");
            container.innerHTML = "";

            if(habits.length === 0) {
                container.innerHTML = `<div class="empty-state">Sin datos para graficar.</div>`;
                return;
            }

            habits.forEach(habit => {
                let completedCount = 0;
                for(let day = 1; day <= 31; day++) {
                    if(records[`${day}_${habit}`]) {
                        completedCount++;
                    }
                }

                const percentage = Math.round((completedCount / 31) * 100);

                const statCard = document.createElement("div");
                statCard.className = "stat-card";
                statCard.innerHTML = `
                    <div class="stat-header">
                        <span class="stat-title">${habit}</span>
                        <span class="stat-percentage">${completedCount}/31 días (${percentage}%)</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
                    </div>
                `;
                container.appendChild(statCard);
            });
        }
    </script>
</body>
</html>
