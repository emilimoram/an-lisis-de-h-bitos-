<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Hábitos y Estudios Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --cell-hover: #f8fafc;
            --cell-checked: #4f46e5;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --cell-hover: #334155;
            --cell-checked: #6366f1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .controls-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input, button {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            font-size: 1.2rem;
            padding: 8px 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
            text-align: center;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 6px;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-weight: 600;
        }

        .task-col {
            text-align: left;
            padding-left: 15px;
            min-width: 220px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.7;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            opacity: 1;
            background-color: rgba(239, 68, 68, 0.1);
        }

        .check-cell {
            cursor: pointer;
            user-select: none;
            width: 32px;
            height: 32px;
            transition: background 0.15s;
        }

        .check-cell:hover {
            background-color: var(--cell-hover);
        }

        .check-cell.checked {
            background-color: var(--cell-checked);
            color: white;
            font-weight: bold;
        }

        .add-task-section {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .add-task-section input {
            flex: 1;
            min-width: 250px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
        }

        .chart-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
            height: 320px;
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .chart-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 1.4rem; }
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <header>
            <h1>✨ Tracker de Hábitos & Estudios Pro</h1>
            <div class="controls-group">
                <select id="monthSelect" onchange="changeMonth()">
                    <option value="0">Enero</option><option value="1">Febrero</option>
                    <option value="2">Marzo</option><option value="3">Abril</option>
                    <option value="4">Mayo</option><option value="5">Junio</option>
                    <option value="6">Julio</option><option value="7">Agosto</option>
                    <option value="8">Septiembre</option><option value="9">Octubre</option>
                    <option value="10">Noviembre</option><option value="11">Diciembre</option>
                </select>
                <select id="colorSelect" onchange="changeAccentColor()">
                    <option value="#4f46e5">Índigo Pro</option>
                    <option value="#10b981">Verde Menta</option>
                    <option value="#ec4899">Rosa Pastel</option>
                    <option value="#f59e0b">Ámbar Cítrico</option>
                    <option value="#0ea5e9">Azul Cielo</option>
                </select>
                <button class="btn btn-icon" id="themeToggle" onclick="toggleTheme()" title="Cambiar Tema">🌙</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-title">Progreso Mensual</span>
                <span class="stat-value" id="globalProgress">0%</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Racha Actual</span>
                <span class="stat-value" id="currentStreak">🔥 0 días</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Total Completados</span>
                <span class="stat-value" id="totalCompleted">0 / 0</span>
            </div>
        </div>

        <div class="table-container">
            <table id="habitTable">
                <thead>
                    <tr id="headerRow">
                        <th class="task-col">Hábito / Actividad</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>

        <div class="add-task-section">
            <input type="text" id="newTaskInput" placeholder="Ej. Estudiar Programación, Clases de Piano, Gimnasio...">
            <button class="btn" onclick="addHabit()">Agregar Hábito</button>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <div class="chart-title">Progreso por Hábito (%)</div>
                <div class="chart-wrapper">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">Cumplimiento Diario General</div>
                <div class="chart-wrapper">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMonth = new Date().getMonth();
        document.getElementById('monthSelect').value = currentMonth;

        let habits = JSON.parse(localStorage.getItem('pro_habits')) || [
            "Clases de Piano",
            "Gimnasio",
            "Fútbol",
            "Ingeniería en IA y Desarrollo",
            "Estudiar Inglés"
        ];

        let habitData = JSON.parse(localStorage.getItem('pro_habitData')) || {};

        let barChartInstance = null;
        let lineChartInstance = null;

        function getDaysInMonth(month, year = new Date().getFullYear()) {
            return new Date(year, month + 1, 0).getDate();
        }

        function initTable() {
            const daysCount = getDaysInMonth(currentMonth);
            const headerRow = document.getElementById('headerRow');
            
            // Construir cabecera con días
            let headerHTML = '<th class="task-col">Hábito / Actividad</th>';
            for (let i = 1; i <= daysCount; i++) {
                headerHTML += `<th>${i}</th>`;
            }
            headerRow.innerHTML = headerHTML;

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            habits.forEach((habit, habitIndex) => {
                let row = document.createElement('tr');
                let taskCell = document.createElement('td');
                taskCell.className = 'task-col';
                taskCell.innerHTML = `<span>${habit}</span> <button class="delete-btn" onclick="deleteHabit(${habitIndex})" title="Eliminar">🗑️</button>`;
                row.appendChild(taskCell);

                for (let day = 1; day <= daysCount; day++) {
                    let td = document.createElement('td');
                    td.className = 'check-cell';
                    
                    let key = `${currentMonth}-${habitIndex}-${day}`;
                    if (habitData[key]) {
                        td.classList.add('checked');
                        td.textContent = '✓';
                    }

                    td.onclick = () => toggleCheck(habitIndex, day, td);
                    row.appendChild(td);
                }
                tableBody.appendChild(row);
            });

            updateStatsAndCharts();
        }

        function toggleCheck(habitIndex, day, cell) {
            let key = `${currentMonth}-${habitIndex}-${day}`;
            if (habitData[key]) {
                delete habitData[key];
                cell.classList.remove('checked');
                cell.textContent = '';
            } else {
                habitData[key] = true;
                cell.classList.add('checked');
                cell.textContent = '✓';
            }
            saveData();
            updateStatsAndCharts();
        }

        function addHabit() {
            const input = document.getElementById('newTaskInput');
            const val = input.value.trim();
            if (val) {
                habits.push(val);
                input.value = '';
                saveData();
                initTable();
            }
        }

        function deleteHabit(index) {
            if (confirm('¿Seguro que deseas eliminar este hábito?')) {
                const daysCount = getDaysInMonth(currentMonth);
                for(let d=1; d<=daysCount; d++) {
                    delete habitData[`${currentMonth}-${index}-${d}`];
                }
                habits.splice(index, 1);
                saveData();
                initTable();
            }
        }

        function changeMonth() {
            currentMonth = parseInt(document.getElementById('monthSelect').value);
            initTable();
        }

        function saveData() {
            localStorage.setItem('pro_habits', JSON.stringify(habits));
            localStorage.setItem('pro_habitData', JSON.stringify(habitData));
        }

        function updateStatsAndCharts() {
            const daysCount = getDaysInMonth(currentMonth);
            let totalPossible = habits.length * daysCount;
            let totalChecked = 0;

            let dailyCounts = Array(daysCount).fill(0);
            let habitCounts = Array(habits.length).fill(0);

            habits.forEach((_, hIdx) => {
                for (let d = 1; d <= daysCount; d++) {
                    let key = `${currentMonth}-${hIdx}-${d}`;
                    if (habitData[key]) {
                        totalChecked++;
                        dailyCounts[d - 1]++;
                        habitCounts[hIdx]++;
                    }
                }
            });

            let percent = totalPossible > 0 ? Math.round((totalChecked / totalPossible) * 100) : 0;
            document.getElementById('globalProgress').textContent = percent + '%';
            document.getElementById('totalCompleted').textContent = `${totalChecked} / ${totalPossible}`;

            // Calcular Racha Actual (Streak)
            let streak = 0;
            let today = new Date();
            let isCurrentMonthActive = (currentMonth === today.getMonth());
            let checkDayLimit = isCurrentMonthActive ? today.getDate() : daysCount;

            for (let d = checkDayLimit; d >= 1; d--) {
                let dayAllChecked = true;
                if (habits.length === 0) { dayAllChecked = false; }
                for (let h = 0; h < habits.length; h++) {
                    if (!habitData[`${currentMonth}-${h}-${d}`]) {
                        dayAllChecked = false;
                        break;
                    }
                }
                if (dayAllChecked) {
                    streak++;
                } else if (d < checkDayLimit) {
                    break;
                }
            }
            document.getElementById('currentStreak').textContent = `🔥 ${streak} días`;

            renderCharts(habitCounts, dailyCounts, daysCount);
        }

        function renderCharts(habitCounts, dailyCounts, daysCount) {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#f8fafc' : '#1e293b';
            const gridColor = isDark ? '#334155' : '#e2e8f0';
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();

            const barCtx = document.getElementById('barChart').getContext('2d');
            const habitPercentages = habits.map((_, hIdx) => {
                let count = 0;
                for (let d = 1; d <= daysCount; d++) {
                    if (habitData[`${currentMonth}-${hIdx}-${d}`]) count++;
                }
                return Math.round((count / daysCount) * 100);
            });

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: habits,
                    datasets: [{
                        label: '% Cumplimiento',
                        data: habitPercentages,
                        backgroundColor: primaryColor,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: 100,
                            grid: { color: gridColor },
                            ticks: { color: textColor }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { color: textColor }
                        }
                    }
                }
            });

            const lineCtx = document.getElementById('lineChart').getContext('2d');
            let dailyPercentages = dailyCounts.map(count => habits.length > 0 ? Math.round((count / habits.length) * 100) : 0);
            let dayLabels = Array.from({length: daysCount}, (_, i) => i + 1);

            if (lineChartInstance) lineChartInstance.destroy();
            lineChartInstance = new Chart(lineCtx, {
                type: 'line',
                data: {
                    labels: dayLabels,
                    datasets: [{
                        label: '% Diario',
                        data: dailyPercentages,
                        borderColor: primaryColor,
                        backgroundColor: primaryColor + '20',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: 100,
                            grid: { color: gridColor },
                            ticks: { color: textColor }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { color: textColor, maxTicksLimit: 15 }
                        }
                    }
                }
            });
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙';
            }
            updateStatsAndCharts();
        }

        function changeAccentColor() {
            const color = document.getElementById('colorSelect').value;
            document.documentElement.style.setProperty('--primary', color);
            document.documentElement.style.setProperty('--cell-checked', color);
            updateStatsAndCharts();
        }

        initTable();
    </script>
</body>
</html>
